[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lectern"
version = "1.0.0"
description = "A desktop reader for the RSV-2CE Bible and the Coverdale Psalter, arranged for the Daily Office"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5", "mobi>=0.3.3"]

[project.gui-scripts]
lectern = "lectern.app:main"

[tool.setuptools.packages.find]
include = ["lectern*"]

[tool.setuptools.package-data]
lectern = ["resources/*", "resources/fonts/*"]

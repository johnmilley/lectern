<!DOCTYPE html>
<html lang="en" class="theme-paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3eee2">
<title>Lectern</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="reader.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="loading">

<header class="bar">
  <button class="icon-btn" data-act="menu" aria-label="Contents" title="Contents">☰</button>
  <form id="omni" role="search" autocomplete="off">
    <input type="search" list="omni-books" enterkeyhint="go" aria-label="Go to a passage or search"
           placeholder="Go to a passage (Jn 3:16, Ps 23) or search…">
    <datalist id="omni-books"></datalist>
  </form>
  <button class="icon-btn" data-act="prev" aria-label="Previous" title="Previous (←)">‹</button>
  <button class="icon-btn" data-act="next" aria-label="Next" title="Next (→)">›</button>
  <a class="bar-link wide-only" href="#/office/today/morning" title="Today's Morning Prayer">Morning</a>
  <a class="bar-link wide-only" href="#/office/today/evening" title="Today's Evening Prayer">Evening</a>
  <button class="icon-btn aa" data-act="settings" aria-label="Preferences" title="Preferences">Aa</button>
</header>

<aside id="drawer" aria-label="Contents">
  <nav class="tabs">
    <button data-tab="bible">Bible</button><button data-tab="psalter">Psalter</button><button data-tab="marks">Bookmarks</button>
  </nav>
  <div class="tab" id="tab-bible"></div>
  <div class="tab" id="tab-psalter" hidden></div>
  <div class="tab" id="tab-marks" hidden></div>
</aside>
<div id="scrim"></div>

<main id="content" class="page"><p class="center loading-note">Opening…</p></main>

<div id="popover" hidden></div>

<div id="selbar" hidden>
  <span class="sel-label"></span>
  <button data-act="copy" title="Copy with reference (Ctrl+C)">Copy</button>
  <button data-act="copy-plain" title="Copy the text only (Ctrl+Shift+C)">Text only</button>
  <button data-act="copy-ref" title="Copy the reference">Reference</button>
  <button data-act="bookmark" title="Bookmark (Ctrl+D)">Bookmark</button>
  <button class="x" data-act="clear" aria-label="Clear selection">×</button>
</div>

<dialog id="settings">
  <header><h2>Preferences</h2><button class="close x" aria-label="Close">×</button></header>
  <div id="settings-body"></div>
</dialog>

<input type="file" id="file" accept=".gz,.json,application/gzip,application/json" hidden>
<div id="toast" hidden role="status"></div>

<script src="books.js"></script>
<script src="data.js"></script>
<script src="render.js"></script>
<script src="copy.js"></script>
<script src="app.js"></script>
</body>
</html>
